CONTROL 6 54321
# Frame origin (SW corner) of the vendenheim-wide time grid: 7.30E, 48.20N.
# Must match the TRANSFORM line in vendenheim-wide.*.DEFAULT.time.hdr exactly.
TRANS LAMBERT GRS-80  48.200000  7.300000  44.000000  49.000000 0.000000

# signature
# (LOCSIG signature)
LOCSIG BCSF-Renass

# comment
# (LOCCOM comment)
LOCCOM Vendenheim

# input  grid filenames root, output filename
# (LOCFILES <obs file> obs_type  <travel-time grid files path/root> <output file path/root>)
LOCFILES {{ OBSFILE }}  NLLOC_OBS {{ NLL_TIME_PATH }}/vendenheim-wide/vendenheim-wide {{ OUTPUT }}

# output hypocenter file types
LOCHYPOUT {{ HYPOUT }}

# search type
# OCT init_num_cells_x init_num_cells_y init_num_cells_z
#       min_node_size max_num_nodes num_scatter
#       use_stations_density stop_on_min_node_size
# 0.2 km grid; 50x49x15 initial cells cover the Vendenheim search region
# (7.55-8.10E, 48.45-48.90N, 0-20 km).
LOCSEARCH OCT 50 49 15 0.01 100000 10000 1 0

#GridSearch#LOCSEARCH GRID 500
#LOCSEARCH MET 10000 1000 4000 5000 5 -1 0.01 8.0 1.0e-10

# location grids description
# (LOCGRID num_x num_y num_z orig_x orig_y orig_z d_x d_y d_z type save_flag)
# Vendenheim local search box 7.55-8.10E, 48.45-48.90N, 0-20 km -> 187 x 263 x 101
# orig in the time-grid frame (km from SW corner 7.30E/48.20N): 16.95, 28.78
LOCGRID 187 263 101  16.95 28.78 0.00  0.20 0.20 0.20  PROB_DENSITY  SAVE

# method
# LOCMETH method max_dist_sta_to_grid min_phases max_phases min_S VpVs max_3d_grids min_dist_dup
LOCMETH {{LOC_METHOD}} 9999.0 {{NLL_MIN_PHASE}} -1 -1 -1 -1 -1 0

# gaussian model error parameters
# (LOCGAU Sigma_T (s), CorrLen (km))
LOCGAU 0.2 0.0

# travel-time dependent gaussian model error parameters
# (LOCGAU2 SigmaTfraction, SigmaTmin (s), SigmaTmax (s))
LOCGAU2 0.01 0.05 2.0

# phase identifier mapping
LOCPHASEID  P   P p G PN PG Pn Pg
LOCPHASEID  S   S s G SN SG Sn Sg

# quality to error mapping
LOCQUAL2ERR 0.1 0.5 1.0 2.0 99999.

# phase statistics parameters
LOCPHSTAT 9999.0 -1 9999.0 1.0 1.0 9999.9 -9999.9 9999.9

# take-off angles mode & minimum quality
LOCANGLES ANGLES_NO 5

# station distribution weighting
LOCSTAWT 1 -1

# =============================================================================
# END of NLLoc control file statements
# =============================================================================
