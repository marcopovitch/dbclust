[project]
name = "dbclust"
version = "0.2"
description = ""
authors = [
    { name = "Marc Grunberg", email = "marc.grunberg@unistra.fr" }
]
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "alphabetic_timestamp",
    "dacite",
    "dateparser",
    "duckdb",
    "fastapi",
    "fastparquet",
    "geopandas",
    "hdbscan",
    "icecream",
    "jinja2",
    "numpy",
    "obspy",
    "pandas",
    "plotly",
    "plotext",
    "prettytable",
    "pyocto",
    "pyproj",
    "ray[default]",
    "rich",
    "scikit-learn",
    "scipy",
    "starlette",
    "tqdm",
    "uvicorn",
    "spatialite",
    "psutil",
    "pyrocko",
    "visidata",
    "python-dateutil",
    "kaleido",
    "geopy",
    "dask[complete]",
    "parsl>=2025.12.22",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff",
    "isort"
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dbclust", "dbclust.*", "fdsnws", "Utils"]

[project.scripts]
fdsnws-server = "fdsnws.server:main"
dbclust = "dbclust.runner:main"
dbclust-parsl = "dbclust.runner_parsl:main"
injectdb = "dbclust.inject_spatialite:main"
relocate = "dbclust.reprocess_event:main"
csv2parquet = "Utils.csv2parquet:main"

[project.urls]
"Homepage" = "https://github.com/marcopovitch/dbclust"
"Bug Tracker" = "https://github.com/marcopovitch/dbclust/issues"
