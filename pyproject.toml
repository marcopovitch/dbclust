[project]
name = "dbclust"
version = "0.2"
description = ""
authors = [
    { name = "Marc Grunberg", email = "marc.grunberg@unistra.fr" }
]
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "alphabetic_timestamp",
    "dacite",
    "dateparser",
    "duckdb",
    "fastapi",
    "fastparquet",
    "geopandas",
    "hdbscan",
    "icecream",
    "jinja2",
    "numpy",
    "obspy==1.4.2",
    "pandas",
    "requests",
    "plotly",
    "plotext",
    "prettytable",
    "pyocto>=0.1.9",
    "pyproj",
    "pyyaml",
    "ray[default]",
    "rich",
    "scikit-learn",
    "scipy",
    "starlette",
    "tqdm",
    "uvicorn",
    "spatialite",
    "psutil",
    "pyrocko>=2025.12.4",
    "visidata",
    "python-dateutil",
    "kaleido",
    "geopy",
    "dask[complete]",
    "parsl>=2025.12.22",
    "pygmt",
    "contextily",
    "rioxarray",
    "setuptools<71",  # required by obspy (pkg_resources, bundled until v70)
    "leidenalg>=0.12.0",
    "python-igraph>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "ruff",
    "isort"
]

[tool.uv]
package = true

# pyrocko uses pkg_resources at build time without declaring it
[tool.uv.extra-build-dependencies]
pyrocko = ["setuptools<71"]

[tool.setuptools]
packages = ["dbclust", "dbclust.executors", "dbclust.db", "Utils", "fdsnws"]

[project.scripts]
fdsnws-server = "fdsnws.server:main"
dbclust = "dbclust.runner:main"
dbclust-parsl = "dbclust.runner_parsl:main"
injectdb = "dbclust.inject_spatialite:main"
relocate = "dbclust.reprocess_event:main"
csv2parquet = "Utils.csv2parquet:main"
csv2parquet-sync = "Utils.csv2parquet_sync:main"
add-event-types = "Utils.add_event_type_columns:main"
nll-locate = "dbclust.locate:main"

[project.urls]
"Homepage" = "https://github.com/marcopovitch/dbclust"
"Bug Tracker" = "https://github.com/marcopovitch/dbclust/issues"
