<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/images/dbclust-bw-192x192.png">
    <title>FDSN Event Search</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        function toggleGeoInputs() {
            const searchType = document.getElementById('geo_search_type').value;
            const bboxInputs = document.getElementById('bbox-inputs');
            const circleInputs = document.getElementById('circle-inputs');

            // Hide all fields initially
            bboxInputs.classList.add('hidden');
            circleInputs.classList.add('hidden');

            // Display fields based on the selection
            if (searchType === 'bounding-box') {
                bboxInputs.classList.remove('hidden');
            } else if (searchType === 'circular') {
                circleInputs.classList.remove('hidden');
            }
        }

        // Call the functions when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            toggleGeoInputs();
            submitSearch(); // Initialize the URL immediately
        });
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f9ff;
            background-image: linear-gradient(120deg, #e0f7fa, #bbdefb);
        }

        select {
            height: 38px; /* Same height as input fields */
            padding: 10px;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);
            margin-top: 20px;
            border-top: 5px solid #42a5f5;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            width: 80px;
            height: auto;
            margin-right: 15px;
        }

        h2 {
            margin: 0;
            color: #1976d2;
            flex-grow: 1;
        }

        fieldset {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e3f2fd;
            background-color: #f5f9ff;
        }

        legend {
            font-weight: bold;
            color: #1976d2;
            padding: 0 10px;
            background-color: white;
            border-radius: 5px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #455a64;
        }

        input, select {
            width: calc(100% - 16px);
            padding: 10px;
            margin-top: 5px;
            border: 2px solid #bbdefb;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            border: none;
            background: linear-gradient(135deg, #42a5f5, #2196f3);
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(135deg, #2196f3, #1976d2);
        }

        #constructed-url {
            margin-top: 15px;
            font-size: 14px;
            background-color: #e3f2fd;
            padding: 12px;
            border-radius: 8px;
            word-break: break-word;
        }

        #constructed-url a {
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
        }

        #constructed-url a:hover {
            text-decoration: underline;
            color: #0d47a1;
        }

        pre {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: "Consolas", monospace;
            color: #333;
        }

        .hidden {
            display: none;
        }

        .header-text {
            flex-grow: 1;
        }

        .db-info {
            background-color: #e2f3ff;
            padding: 4px 12px;
            border-radius: 4px;
            margin-top: 5px;
            font-size: 13px;
            display: inline-block;
            border-left: 4px solid #0d6efd;
        }

        .db-label {
            font-weight: bold;
            color: #0a58ca;
            margin-right: 8px;
        }

        .db-name {
            font-family: monospace;
            color: #0a58ca;
            cursor: help;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="/static/images/dbclust-logo.png" alt="DBClust logo" class="logo">
            <div class="header-text">
                <h2>Search for Seismic Events</h2>
                <div class="db-info" id="dbInfo">
                    <span class="db-label">Database:</span>
                    <span class="db-name" id="dbName">Loading...</span>
                </div>
            </div>
        </div>

        <form id="search-form">
            <fieldset>
                <legend>⏱️ Time Constraints</legend>
                <label for="starttime">Start Date:</label>
                <input type="text" id="starttime" name="starttime" placeholder="dd/mm/yyyy hh:mm" autocomplete="off">

                <label for="endtime">End Date:</label>
                <input type="text" id="endtime" name="endtime" placeholder="dd/mm/yyyy hh:mm" autocomplete="off">
            </fieldset>

            <fieldset>
                <legend>🌍 Geographic Constraints</legend>

                <label for="geo_search_type">Search Type:</label>
                <select id="geo_search_type" onchange="toggleGeoInputs()">
                    <option value="no-constraints" selected>No geographic constraints</option>
                    <option value="bounding-box">Bounding Box</option>
                    <option value="circular">Circular Search</option>
                </select>

                <!-- Bounding Box Inputs -->
                <div id="bbox-inputs" class="hidden">
                    <label for="minlatitude">Min Latitude:</label>
                    <input type="number" step="0.01" id="minlatitude" name="minlatitude">

                    <label for="maxlatitude">Max Latitude:</label>
                    <input type="number" step="0.01" id="maxlatitude" name="maxlatitude">

                    <label for="minlongitude">Min Longitude:</label>
                    <input type="number" step="0.01" id="minlongitude" name="minlongitude">

                    <label for="maxlongitude">Max Longitude:</label>
                    <input type="number" step="0.01" id="maxlongitude" name="maxlongitude">
                </div>

                <!-- Circular Search Inputs -->
                <div id="circle-inputs" class="hidden">
                    <label for="latitude">Center Latitude:</label>
                    <input type="number" step="0.01" id="latitude" name="latitude">

                    <label for="longitude">Center Longitude:</label>
                    <input type="number" step="0.01" id="longitude" name="longitude">

                    <label for="minradius">Min Radius (°):</label>
                    <input type="number" step="0.01" id="minradius" name="minradius">

                    <label for="maxradius">Max Radius (°):</label>
                    <input type="number" step="0.01" id="maxradius" name="maxradius">
                </div>
            </fieldset>

            <fieldset>
                <legend>🔍 Service Specific Constraints</legend>

                <label for="eventtype">Event Type:</label>
                <select id="eventtype" name="eventtype" onchange="updateURL()">
                    <option value="">All events</option>
                    <option value="earthquake">Earthquake</option>
                    <option value="induced or triggered event">Induced / Triggered</option>
                    <option value="quarry blast">Quarry Blast</option>
                    <option value="explosion">Explosion</option>
                </select>

                <label for="eventid">Event ID:</label>
                <input type="text" id="eventid" name="eventid">

                <label for="mindepth">Min Depth (km):</label>
                <input type="number" step="1" id="mindepth" name="mindepth">

                <label for="maxdepth">Max Depth (km):</label>
                <input type="number" step="1" id="maxdepth" name="maxdepth">

                <label for="minmagnitude">Min Magnitude:</label>
                <input type="number" step="0.1" id="minmagnitude" name="minmagnitude">

                <label for="maxmagnitude">Max Magnitude:</label>
                <input type="number" step="0.1" id="maxmagnitude" name="maxmagnitude">

                <label for="Magnitude Type">Magnitude Type:</label>
                <input type="text" id="magnitudetype" name="magnitudetype">
            </fieldset>

            <fieldset>
                <legend>📊 Output Control</legend>

                <label for="format">Format:</label>
                <select id="format" name="format">
                    <option value="quakeml" selected>QuakeML (default)</option>
                    <option value="text">Text, FDSN formatted (| delimited)</option>
                    <option value="csv">CSV (enriched with additional columns)</option>
                    <option value="html">HTML table</option>
                    <option value="json">JSON</option>
                    <option value="geojson">GeoJSON</option>
                </select>

                <label for="limit">Limit:</label>
                <input type="number" id="limit" name="limit">

                <label for="offset">Offset:</label>
                <input type="number" id="offset" name="offset">

                <label for="orderby">Order By:</label>
                <select id="orderby" name="orderby">
                    <option value="time">Time Descending (default)</option>
                    <option value="time-asc">Time Ascending</option>
                    <option value="magnitude">Magnitude descending</option>
                    <option value="magnitude-asc">Magnitude ascending</option>
                </select>


            </fieldset>
        </form>

        <h3>Request URL:</h3>
        <div id="constructed-url">The URL will appear here...</div>
    </div>

    <script>
        function toggleGeoInputs() {
            const type = document.getElementById("geo_search_type").value;
            document.getElementById("bbox-inputs").classList.toggle("hidden", type !== "bounding-box");
            document.getElementById("circle-inputs").classList.toggle("hidden", type !== "circular");
        }

        // Date/time pickers using day/month/year with 24h time, defaulting to 00:00
        const dateTimeOptions = {
            enableTime: true,
            time_24hr: true,
            dateFormat: "d/m/Y H:i",
            defaultHour: 0,
            defaultMinute: 0,
            onChange: submitSearch,
        };
        flatpickr("#starttime", dateTimeOptions);
        flatpickr("#endtime", dateTimeOptions);

        // Convert a "dd/mm/yyyy HH:MM" value to an ISO 8601 string ("yyyy-mm-ddTHH:MM")
        function toIsoDateTime(value) {
            const match = value.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})$/);
            if (!match) {
                return value;
            }
            const [, day, month, year, hours, minutes] = match;
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        function submitSearch() {
            const form = document.getElementById('search-form');
            const formData = new FormData(form);
            const params = new URLSearchParams();

            // Add only non-empty parameters
            formData.forEach((value, key) => {
                if (value.trim() !== "") {
                    if (key === "starttime" || key === "endtime") {
                        value = toIsoDateTime(value);
                    }
                    params.append(key, value);
                }
            });

            const url = `${window.location.origin}/fdsnws/event/1/query?${params.toString()}`;
            document.getElementById('constructed-url').innerHTML = `<a href="${url}" target="_blank">${url}</a>`;
        }

        // Update URL on any form input change
        document.getElementById('search-form').addEventListener('input', submitSearch);

        // Also update URL when the page loads
        submitSearch();

        // Fetch and display database info
        fetch('/api/db-info')
            .then(response => response.json())
            .then(data => {
                const dbNameElement = document.getElementById('dbName');
                dbNameElement.textContent = data.db_name;
            })
            .catch(error => {
                const dbNameElement = document.getElementById('dbName');
                dbNameElement.textContent = 'Unknown';
                dbNameElement.style.color = '#dc3545';
            });
    </script>

</body>
</html>
