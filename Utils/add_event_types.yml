# Configuration for add_event_type_columns.py / add-event-types
#
# input_file: path to the main alceste CSV (must have agency_names and
#             agencies_list columns), relative to this config file.
# output_file: path for the enriched output CSV, relative to this config file.
# agencies: list of agency configurations
#
# Two modes, mutually exclusive:
#   - file: path to a source CSV with event_id and event_type columns
#            the join is done by matching event_ids between agencies_list and
#            the source file
#   - fixed_event_type: a fixed value assigned whenever the agency appears in
#                       agency_names (for agencies that only contribute one
#                       event type, e.g. earthquake)
#
# Agency bulletin CSVs (agencies_bulletins/*.csv) are run-specific data and
# are not versioned in this repo: place them next to this config file on the
# HPC run directory.
#
# event_type_groups: optional mapping of event_type label -> canonical group
# name, used when computing event_type_consensus/event_type_final so that
# equivalent labels from different agencies (e.g. "explosion" and
# "controlled explosion") are not reported as a conflict. Labels not listed
# here are left unchanged (each is its own group).
#
# agency_priority: optional ordered list of agency_name values used to
# resolve event_type_consensus == "conflict" (agencies disagree on the
# normalized event_type). The normalized value from the highest-priority
# agency that has one is used as the agency-derived event_type. Agencies
# not listed here are considered last, in the order they appear in
# 'agencies'. event_type_consensus itself is left untouched ("conflict"
# still means the agencies disagreed).
#
# spectrocnn_column: optional name of a column already present in the input
# file holding an automatic event_type prediction from the spectrocnn CNN
# (spectrogram-based discrimination). When present, a derived column
# event_type_SPECTROCNN is filled only for the trusted predictions
# ("earthquake" / "quarry blast" -- "unknown" is ignored). This column is
# not used for event_type_consensus/conflict (agency-only), but it takes
# priority over the agency-derived value (consensus, or conflict resolved
# via agency_priority) for event_type_final:
#   - if the agency-derived value (normalized via event_type_groups) is a
#     more precise label compatible with the spectrocnn category (per
#     spectrocnn_compatibility below), that precise label is used as
#     event_type_final and event_type_final_source is set to
#     "spectrocnn+agencies"
#   - otherwise event_type_final is the spectrocnn value and
#     event_type_final_source is "spectrocnn"
# When spectrocnn has no trusted value, the agency-derived value is used as
# before (source "consensus_agencies") or event_type_final stays empty.
#
# spectrocnn_compatibility: mapping of spectrocnn category -> list of
# normalized agency labels considered as a compatible refinement of that
# category (used as described above).

input_file:  /Users/marc/Data/DBClust/Alceste/db-2010_2023/alceste-2010_2023-2.csv
output_file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/alceste-2010_2023-2-with_event_types.csv

agency_priority:
  - RENASS
  - LDG

spectrocnn_column: event_type

spectrocnn_compatibility:
  earthquake:
    - earthquake
    - induced or triggered event
  quarry blast:
    - quarry blast
    - explosion

event_type_groups:
  controlled explosion: explosion
  accidental explosion: explosion
  mining explosion: explosion
  experimental explosion: explosion
  rockslide: landslide
  rock burst: landslide
  mine collapse: landslide

agencies:
  - agency_name: LDG
    file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/agencies_bulletins/ldg_2010-2018_01.03.2026.csv

  - agency_name: RENASS
    file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/agencies_bulletins/renass-2010_2023-2026.06.04.csv

  - agency_name: OMP
    file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/agencies_bulletins/OMP_2010-2019.csv

  - agency_name: BGS
    file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/agencies_bulletins/BGS_2010-2023.csv

  - agency_name: ICGC
    file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/agencies_bulletins/ICGC_2010-2023.csv

  - agency_name: IGN
    file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/agencies_bulletins/IGN_2010-2023.csv

  - agency_name: ORB
    file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/agencies_bulletins/ORB_2010-2023.csv

  - agency_name: LED
    file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/agencies_bulletins/LED_2010-2023.csv

  - agency_name: INGV
    file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/agencies_bulletins/INGV_2010-2023.csv

  - agency_name: SED
    file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/agencies_bulletins/SED_2010-2023.csv

  # Agencies that classify all events as earthquakes — no source file needed
  - agency_name: ISTERRE
    fixed_event_type: earthquake
