# Configuration for add_event_type_columns.py / add-event-types
#
# input_file: path to the main catalog CSV (must have agency_names and
#             agencies_list columns), relative to this config file.
# output_file: path for the enriched output CSV, relative to this config file.
# event_type_final_distribution_file: optional path (relative to this config
#             file) for a CSV with the event_type_final value counts
#             (columns: event_type_final, count).
# event_type_final_source_distribution_file: optional path (relative to this
#             config file) for a CSV with the event_type_final_source value
#             counts (columns: event_type_final_source, count).
# event_type_final_distribution_plot_file: optional path (relative to this
#             config file) for an interactive HTML bar chart of the
#             event_type_final distribution.
# event_type_final_source_distribution_plot_file: optional path (relative to
#             this config file) for an interactive HTML bar chart of the
#             event_type_final_source distribution. Includes an explanation
#             of the consensus/single/conflict/spectrocnn labels.
# agencies: list of agency configurations
#
# Two modes, mutually exclusive:
#   - file: path to a source CSV with event_id and event_type columns
#            the join is done by matching event_ids between agencies_list and
#            the source file
#   - fixed_event_type: a fixed value assigned whenever the agency appears in
#                       agency_names (for agencies that only contribute one
#                       event type, e.g. earthquake)
#
# Agency bulletin CSVs (agencies_bulletins/*.csv) are run-specific data and
# are not versioned in this repo: place them next to this config file on the
# HPC run directory.
#
# event_type_groups: optional mapping of event_type label -> canonical group
# name, used when computing event_type_consensus/event_type_final so that
# equivalent labels from different agencies (e.g. "explosion" and
# "controlled explosion") are not reported as a conflict. Labels not listed
# here are left unchanged (each is its own group).
#
# agency_priority: optional ordered list of agency_name values used to
# resolve event_type_consensus == "conflict" (agencies disagree on the
# normalized event_type). The normalized value from the highest-priority
# agency that has one is used as the agency-derived event_type. Agencies
# not listed here are considered last, in the order they appear in
# 'agencies'. event_type_consensus itself is left untouched ("conflict"
# still means the agencies disagreed).
#
# spectrocnn_predictions_file: optional path (or list of paths) to the
# spectrocnn predictions CSV(s) (produced by the spectrocnn discrimination
# pipeline). Each file must contain columns event_id and predhdq50
# (0=earthquake, 1=quarry blast, other=unknown). When a list is given, the
# files are concatenated and deduplicated by event_id (first file in the list
# wins on duplicates).
# When present, a column event_type_SPECTROCNN is filled for each input event
# whose event_id appears in the predictions file with a trusted prediction
# (predhdq50 == 0 or 1). This column is not used for event_type_consensus
# (agency-only), but takes priority over the agency-derived value for
# event_type_final:
#   - if the agency-derived value is a more precise label compatible with the
#     spectrocnn category (per spectrocnn_compatibility below), that precise
#     label is used as event_type_final (source "spectrocnn+<agency_source>")
#   - otherwise event_type_final is the spectrocnn value (source "spectrocnn")
# When spectrocnn has no trusted value, the agency-derived value is used
# (source = consensus / single:<AGENCY> / conflict:<AGENCY>).
#
# spectrocnn_compatibility: mapping of spectrocnn category -> list of
# normalized agency labels considered as a compatible refinement of that
# category (used as described above).

input_file:  /Users/marc/Data/DBClust/Alceste/db-2010_2023/alceste-2010_2023.csv
output_file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/alceste-2010_2023-with_event_types.csv
event_type_final_distribution_file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/event_type_final_distribution.csv
event_type_final_source_distribution_file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/event_type_final_source_distribution.csv
event_type_final_distribution_plot_file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/event_type_final_distribution.html
event_type_final_source_distribution_plot_file: /Users/marc/Data/DBClust/Alceste/db-2010_2023/event_type_final_source_distribution.html

agency_priority:
